plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vip.planner'
    compileSdk 35

    defaultConfig {
        applicationId "com.vip.planner"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 모든 kotlin-stdlib(jdk7/jdk8 포함) 버전을 정렬해 중복 클래스 충돌 방지
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebView 는 안드로이드 프레임워크(android.webkit) 기본 제공이라 별도 의존성 불필요
}
